<!DOCTYPE html>
<html>
<head>
  <title>ShopX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔷 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark gradient-nav">
  <div class="container">
    <a class="navbar-brand fw-bold">ShopX</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link">Home</a></li>
        <li class="nav-item"><a class="nav-link">Categories</a></li>
        <li class="nav-item"><a class="nav-link">Cart 🛒</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- 🔷 Hero Banner -->
<section class="hero-banner text-white text-center d-flex align-items-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Big Sale is Live 🔥</h1>
    <p class="lead">Up to 50% off on selected products</p>
    <button class="btn btn-light btn-lg mt-3">Shop Now</button>
  </div>
</section>

<!-- 🔷 Filters -->
<div class="container mt-4 text-center">
  <button class="btn filter-btn">All</button>
  <button class="btn filter-btn">Electronics</button>
  <button class="btn filter-btn">Fashion</button>
  <button class="btn filter-btn">Under ₹2000</button>
</div>

<!-- 🔷 Products -->
<div class="container-fluid py-5">
  <div class="row g-4 px-4">

    <!-- Product -->
    <div class="col-lg-3 col-md-4 col-sm-6">
      <div class="card product-card">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body">
          <h5>Smart Watch</h5>
          <p class="text-muted small">Fitness tracking</p>
          <div class="d-flex justify-content-between">
            <span class="price">₹1999</span>
            <button class="btn btn-sm btn-buy">Buy</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Copy more cards -->
    <div class="col-lg-3 col-md-4 col-sm-6">
      <div class="card product-card">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body">
          <h5>Headphones</h5>
          <p class="text-muted small">Noise cancelling</p>
          <div class="d-flex justify-content-between">
            <span class="price">₹1499</span>
            <button class="btn btn-sm btn-buy">Buy</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6">
      <div class="card product-card">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body">
          <h5>Sneakers</h5>
          <p class="text-muted small">Comfort wear</p>
          <div class="d-flex justify-content-between">
            <span class="price">₹2499</span>
            <button class="btn btn-sm btn-buy">Buy</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-4 col-sm-6">
      <div class="card product-card">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body">
          <h5>Backpack</h5>
          <p class="text-muted small">Travel friendly</p>
          <div class="d-flex justify-content-between">
            <span class="price">₹999</span>
            <button class="btn btn-sm btn-buy">Buy</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 🔷 Footer -->
<footer class="footer text-white text-center">
  <p>📧 support@shopx.com</p>
  <p>© 2026 ShopX</p>
</footer>

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
