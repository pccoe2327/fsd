<!DOCTYPE html>
<html>
<head>
  <title>Movie Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-4">

  <h2 class="text-center mb-4">🎬 Movie Booking</h2>

  <!-- MOVIES -->
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card movie-card">
        <div class="movie-img">Movie</div>
        <div class="card-body text-center">
          <h5>Avengers</h5>
          <p>6:00 PM</p>
          <button class="btn btn-dark" onclick="selectMovie('Avengers',200)">Select</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card movie-card">
        <div class="movie-img">Movie</div>
        <div class="card-body text-center">
          <h5>Inception</h5>
          <p>8:00 PM</p>
          <button class="btn btn-dark" onclick="selectMovie('Inception',250)">Select</button>
        </div>
      </div>
    </div>

  </div>

  <!-- SEATS -->
  <h4 class="mt-5">Select Seats</h4>
  <div class="seat-grid mt-3" id="seats"></div>

  <!-- SUMMARY -->
  <div class="summary mt-4">
    <h5>Booking Summary</h5>
    <p>Movie: <span id="movie">None</span></p>
    <p>Seats: <span id="seatCount">0</span></p>
    <p>Total: ₹<span id="total">0</span></p>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
